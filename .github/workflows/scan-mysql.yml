name: Scan MySQL (X fetch)

env:
  # Daily cron + workflow_dispatch default when accounts input is empty
  SCHEDULED_ACCOUNTS: aleabitoreddit,mingchikuo,justinsuntron
  SCHEDULED_XUEQIU_USERS: "1247347556,1102105103"

on:
  schedule:
    # 每周六 17:40 北京时间（UTC+8）触发，但下方 gate job 会过滤成「隔周」，
    # 实际执行频率是原来的一半。
    # 注：cron 同时限定「日」和「星期」时是 OR 语义（如 "1-7,15-21 * 6"
    # 会变成「那些日期每天 + 每个周六」，频率反而变高），所以不能用日期区间实现隔周。
    - cron: "40 9 * * 6"
  workflow_dispatch:
    inputs:
      accounts:
        description: "X accounts (comma-separated, e.g. aleabitoreddit)"
        required: false
        default: "aleabitoreddit,mingchikuo,justinsuntron"
        type: string
      window_days:
        description: "Lookback window in days (X API ~63; older via guest backfill)"
        required: false
        default: "63"
        type: string
      max_posts:
        description: "Max posts to fetch per account (auto-scaled when window > 63)"
        required: false
        default: "4000"
        type: string
      max_pages:
        description: "Max API/guest pages per account (auto-scaled when window > 63)"
        required: false
        default: "40"
        type: string

concurrency:
  group: scan-mysql
  cancel-in-progress: true

jobs:
  # 频率闸门：只在 ISO 周数为偶数的周六真正执行抓取（即隔周一次）。
  # 手动 workflow_dispatch 不受限制，随时可跑。
  gate:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - id: check
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "run=1" >> "$GITHUB_OUTPUT"
            echo "手动触发，不限频率"
            exit 0
          fi
          week=$(date -u +%V)
          if [ $((10#$week % 2)) -eq 0 ]; then
            echo "run=1" >> "$GITHUB_OUTPUT"
            echo "ISO 周 $week 为偶数 → 本周执行"
          else
            echo "run=0" >> "$GITHUB_OUTPUT"
            echo "ISO 周 $week 为奇数 → 本周跳过（隔周执行）"
          fi

  scan:
    needs: gate
    if: needs.gate.outputs.run == '1'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: python -m unittest discover -s tests -q

      - name: Resolve fetch caps
        id: caps
        run: |
          eval "$(python scripts/ci_fetch_caps.py \
            --window-days "${{ github.event.inputs.window_days || '63' }}" \
            --max-posts "${{ github.event.inputs.max_posts || '4000' }}" \
            --max-pages "${{ github.event.inputs.max_pages || '40' }}")"
          echo "max_posts=$MAX_POSTS" >> "$GITHUB_OUTPUT"
          echo "max_pages=$MAX_PAGES" >> "$GITHUB_OUTPUT"
          echo "guest_prefetch=$GUEST_PREFETCH" >> "$GITHUB_OUTPUT"
          python scripts/ci_fetch_caps.py \
            --window-days "${{ github.event.inputs.window_days || '63' }}" \
            --max-posts "$MAX_POSTS" \
            --max-pages "$MAX_PAGES" \
            --format json

      - name: Guest pre-API prefetch (extended window)
        if: steps.caps.outputs.guest_prefetch == '1'
        env:
          MYSQL_PASSWORD: ${{ secrets.MYSQL_PASSWORD }}
        run: |
          python scripts/extended_prefetch.py \
            --accounts "${{ github.event.inputs.accounts || env.SCHEDULED_ACCOUNTS }}" \
            --window-days "${{ github.event.inputs.window_days || '63' }}" \
            --max-posts "${{ steps.caps.outputs.max_posts }}" \
            --max-pages "${{ steps.caps.outputs.max_pages }}"

      - name: Fetch into MySQL
        env:
          MYSQL_PASSWORD: ${{ secrets.MYSQL_PASSWORD }}
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
        run: |
          python scripts/scan_mysql.py \
            --source x \
            --accounts "${{ github.event.inputs.accounts || env.SCHEDULED_ACCOUNTS }}" \
            --window-days "${{ github.event.inputs.window_days || '63' }}" \
            --limit "${{ steps.caps.outputs.max_posts }}" \
            --max-pages "${{ steps.caps.outputs.max_pages }}"

      - name: Fetch Xueqiu into MySQL
        env:
          MYSQL_PASSWORD: ${{ secrets.MYSQL_PASSWORD }}
          XUEQIU_COOKIE: ${{ secrets.XUEQIU_COOKIE }}
        run: |
          python scripts/fetch_xueqiu.py \
            --users "${{ env.SCHEDULED_XUEQIU_USERS }}" \
            --window-days "${{ github.event.inputs.window_days || '63' }}" \
            --limit "${{ steps.caps.outputs.max_posts }}" \
            --max-pages "${{ steps.caps.outputs.max_pages }}"

      - name: MySQL coverage report
        env:
          MYSQL_PASSWORD: ${{ secrets.MYSQL_PASSWORD }}
        run: |
          python scripts/mysql_coverage.py \
            --accounts "${{ github.event.inputs.accounts || env.SCHEDULED_ACCOUNTS }}" \
            --window-days "${{ github.event.inputs.window_days || '63' }}"

      - name: Notify Bark on failure
        if: failure()
        env:
          BARK_PUSH_URL: https://api.day.app/CXFgAnMVdZXTPvsKRgWKFo
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python - <<'PY'
          import os
          import requests

          requests.post(
              os.environ["BARK_PUSH_URL"],
              json={
                  "title": "stock-detect 每日抓取失败",
                  "body": f"雪球/X 抓取失败，可能需要刷新 XUEQIU_COOKIE。{os.environ['RUN_URL']}",
                  "group": "stock-detect",
                  "level": "timeSensitive",
              },
              timeout=15,
          ).raise_for_status()
          PY
