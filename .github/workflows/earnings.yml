name: 美股财报提醒

on:
  schedule:
    # 周一到周五 上午08:00 (UTC+8 = 00:00 UTC)
    - cron: '0 0 * * 1-5'
  workflow_dispatch:

jobs:
  earnings-push:
    runs-on: ubuntu-latest
    # 209 只标的逐只走 yfinance + 限流 sleep；缓存全 miss 时约 25 分钟，留足余量
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Earnings script
        env:
          EARNINGS_PUSH_API: ${{ secrets.EARNINGS_PUSH_API }}
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_NAME: ${{ secrets.DB_NAME }}
        run: python stock_push/earnings.py
